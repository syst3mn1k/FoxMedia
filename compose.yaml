
services:
  butler-api:
    image: foxmedia-butler:0.1.0
    container_name: foxmedia-butler-api
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - .env
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  butler-bot:
    image: foxmedia-butler:0.1.0
    container_name: foxmedia-butler-bot
    command:
      - python
      - -m
      - app.bot.main
    env_file:
      - .env
    environment:
      BUTLER_API_URL: http://butler-api:8000
    depends_on:
      butler-api:
        condition: service_healthy
    restart: unless-stopped
    init: true

  butler-worker:
    image: foxmedia-butler:0.1.0
    container_name: foxmedia-butler-worker
    command:
      - python
      - -m
      - app.workers.job_worker
    env_file:
      - .env
    restart: unless-stopped
    init: true
